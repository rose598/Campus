app:
  name: GraphCampus
  version: 1.0.0
  debug: false

llm:
  provider: openai          # openai | qwen | deepseek
  model: gpt-4o-mini
  temperature: 0.3
  max_retries: 3
  backoff_base: 1.0
  circuit_breaker_threshold: 5
  circuit_breaker_reset_seconds: 30
  concurrency_limit: 3
  rate_limit_per_min: 10

embedding:
  model: sentence-transformers/all-MiniLM-L6-v2
  device: cpu

rag:
  bm25_top_k: 5
  dense_top_k: 5
  rrf_k: 60
  final_top_k: 3
  chunk_size: 512
  chunk_overlap: 50

campus_qa:
  enabled: true
  indexes:
    - academic
    - life
    - course
  time_decay_lambda: 0.01
  default_expiry_days: 365

cache:
  semantic_similarity_threshold: 0.92
  ttl_seconds: 3600
  max_size: 1000

database:
  path: data/graphcampus.db
  wal_mode: true

logging:
  level: INFO
  format: json
  output: console+file
# app	应用元信息
#llm	大模型调用策略与鲁棒性保障
#embedding	文本向量化模型
#rag	混合检索（BM25 + 稠密检索）参数
#campus_qa	校园问答专属行为（索引分类、时效衰减）
#cache	语义缓存，加速重复问题
#database	持久化存储（SQLite）
#logging	日志格式与输出
