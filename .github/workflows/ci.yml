name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  smoke-test:
    name: 集成冒烟测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装依赖（CI 精简集，跳过重型模型依赖）
        run: |
          grep -Ev "^(sentence-transformers|pyvis|streamlit|pypdfium2|python-docx)" requirements.txt > requirements-ci.txt
          pip install -r requirements-ci.txt

      - name: 导入种子数据
        run: python scripts/seed_mock_data.py --reset

      - name: Day 13 集成联调
        run: python scripts/integration_day13.py

      - name: Day 14 全链路 E2E
        run: python scripts/e2e_day14.py

      - name: Day 19 三子图并行联调
        run: python scripts/parallel_day19.py

      - name: 单元测试（若 tests/ 存在）
        run: |
          if [ -d tests ]; then
            pytest tests/ -v --tb=short
          else
            echo "tests/ 不存在，跳过（由角色 D 建设）"
          fi

  docker-build:
    name: Docker 镜像构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 构建镜像
        run: docker build -t graphcampus:ci .

      - name: 镜像启动自检
        run: |
          docker run -d --name gc-ci -p 8501:8501 graphcampus:ci
          sleep 15
          curl -sf http://127.0.0.1:8501/_stcore/health || (docker logs gc-ci; exit 1)
          docker stop gc-ci
